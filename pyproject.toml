[project]
name = "code-health-evals"
version = "0.1.0"
description = "A labeled dataset of real code review bugs, proved in E2B and synced to Langfuse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "e2b>=2.62.0",
    "langchain-openai>=1.7.3",
    "langfuse>=5.1,<6",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
